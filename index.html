<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OrbitAll Money">
<meta name="application-name" content="OrbitAll Money">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M6.48 20.44A10.5 5.5 -25 0 1 25.52 11.56' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5.6' fill='%23fff' stroke='%234f46e5' stroke-width='1.6'/%3E%3Cpath d='M25.52 11.56A10.5 5.5 -25 0 1 6.48 20.44' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>OrbitAll Money</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f6f8; --card:#ffffff; --text:#0f1b33; --muted:#5b6475; --line:#e6e8ee; --fill:#eef0f4; --input:#f7f8fa;
  --accent:#4f46e5; --accent-soft:#eef0ff; --accent-ink:#3730a3; --on-accent:#ffffff;
  --ink:#0f1b33; --on-ink:#ffffff; --ink-soft:rgba(255,255,255,.1);
  --ok:#047857; --ok-soft:#e7f6ef; --warn:#b45309; --warn-soft:#fdf3e4; --bad:#c62828; --bad-soft:#fdecec;
  --gold:#854d0e; --gold-soft:#fbf3dc;
  --brand:var(--accent); --brand-soft:var(--accent-soft);
  --radius:16px; --shadow:0 1px 2px rgba(15,27,51,.05),0 1px 8px rgba(15,27,51,.04); --shadow-lg:0 12px 32px rgba(15,27,51,.16);
  --bar:rgba(255,255,255,.9); --scrim:rgba(10,15,30,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0f17; --card:#141a24; --text:#e7eaf0; --muted:#9aa3b2; --line:#232b38; --fill:#1c2330; --input:#101620;
    --accent:#8b8cff; --accent-soft:#22264a; --accent-ink:#c7c8ff; --on-accent:#0b0f17;
    --ink:#1a2233; --on-ink:#e7eaf0; --ink-soft:rgba(255,255,255,.06);
    --ok:#34d399; --ok-soft:#0f2a22; --warn:#fbbf24; --warn-soft:#2b2212; --bad:#f87171; --bad-soft:#2e1717;
    --gold:#facc15; --gold-soft:#2a2410;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 0 0 1px rgba(255,255,255,.04); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
    --bar:rgba(16,21,30,.9); --scrim:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
svg.i.sm{width:16px;height:16px;vertical-align:-3px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brandname{font-weight:700;font-size:16px;flex:1;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.brandlogo{display:inline-flex}.brandlogo .logo{width:26px;height:26px}
.viewas{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:3px 8px 2px 10px;flex:none}
.viewas label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.viewas select{border:none;background:transparent;font-weight:600;font-size:15px;padding:0 0 2px;outline:none;max-width:170px}
.iconbtn{background:var(--card);border:1px solid var(--line);width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:var(--text);cursor:pointer}
main{padding:16px}
h1{font-size:28px;font-weight:700;margin:4px 0 4px;letter-spacing:-.6px;line-height:1.2}
h2{font-size:17px;font-weight:650;letter-spacing:-.2px;color:var(--text);margin:26px 2px 10px;display:flex;align-items:center;justify-content:space-between}
h2 a{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;letter-spacing:0}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;color:var(--text)}
.hero{background:var(--ink);color:var(--on-ink)}
.hero .label{opacity:.75;font-size:13px;font-weight:500}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-1px;margin:2px 0 14px}
.hero .split{display:flex;gap:8px}
.hero .split div{flex:1;background:var(--ink-soft);border-radius:10px;padding:8px 10px;font-size:12px;opacity:.95}
.hero .split b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border:none;text-align:left;cursor:pointer}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.stat .t{font-size:13px;color:var(--muted)}
.stat.alert .n{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px}
.emoji{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.emoji.gold{background:var(--gold-soft);color:var(--gold)}
.mini{width:28px;height:28px;border-radius:8px;background:var(--fill);color:var(--muted);display:grid;place-items:center;flex:none}
.mini svg.i{width:16px;height:16px}
.chev{color:var(--muted);display:flex}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.small{font-size:13px;color:var(--muted)}
.amt{font-weight:650;white-space:nowrap;letter-spacing:-.2px}
.bar{height:6px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.low>i{background:var(--warn)} .bar.empty>i{background:var(--bad)} .bar.goal>i{background:var(--ok)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;background:var(--accent-soft);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);color:var(--card)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.block{width:100%;padding:13px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45}
.btn:focus-visible,.stat:focus-visible,nav.tabs button:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{width:100%;margin-bottom:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.2px;vertical-align:1px}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.declined{background:var(--bad-soft);color:var(--bad)}
.pill.cancelled{background:var(--fill);color:var(--muted)}
.pill.role{background:var(--fill);color:var(--muted)}
.reason{margin:10px 0 0;font-size:15px}
.note{margin-top:10px;font-size:14px;background:var(--fill);border-radius:10px;padding:8px 10px;color:var(--muted)}
.note.warnnote{background:var(--bad-soft);color:var(--bad)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.feed .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.feed .item:last-child{border-bottom:none}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--muted)}
.dot svg.i{width:17px;height:17px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--avc,#5b6475);color:#fff;font-weight:600;font-size:14px;letter-spacing:.2px}
.av.big{width:40px;height:40px;font-size:16px}
.chip .av{width:20px;height:20px;font-size:12px;margin-right:6px;vertical-align:-5px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.members{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.member{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:92px;text-align:center;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.member.me{box-shadow:inset 0 0 0 2px var(--accent)}
.banner{background:var(--warn-soft);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px;border-left:3px solid var(--warn)}
.banner.info{background:var(--accent-soft);border-left-color:var(--accent)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .wrap{display:flex;width:100%;max-width:520px}
nav.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12px;font-weight:500;color:var(--muted);padding:6px 0;position:relative;cursor:pointer}
nav.tabs button .ic{line-height:0}
nav.tabs button .ic svg.i{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:1px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:12px;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-.3px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--input);border-radius:10px;
  padding:12px;font-size:16px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--card)}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.picker label{margin:0;display:block;cursor:pointer}
.picker input{position:absolute;opacity:0;width:1px;height:1px}
.picker span{display:grid;place-items:center;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--muted)}
.picker input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent)}
.picker input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:14px;margin:-4px 0 12px;min-height:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1}
.rollrow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.rollrow label{display:flex;align-items:center;gap:8px;font-weight:600}
.rollrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.rollrow select{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:8px 10px;font-size:15px}
.rolltag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:4px 8px}
.rolltag.keep{color:var(--muted);background:var(--fill)}
.sumlist{list-style:none;padding:0;margin:0 0 14px}
.sumlist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.sumlist li svg.i{color:var(--muted);margin-right:4px}
.sumlist li:last-child{border-bottom:none}
.txn{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.txn:last-child{border-bottom:none}
.txn .amt.in{color:var(--ok)}
.pill.demo{background:var(--accent-soft);color:var(--accent-ink)}
.pill.csv{background:var(--fill);color:var(--muted)}
.pill.uncat{background:var(--warn-soft);color:var(--warn)}
.pill.match{background:var(--ok-soft);color:var(--ok)}
.filebtn{position:relative;overflow:hidden;display:flex;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.unalloc{box-shadow:inset 0 0 0 1px var(--ok),var(--shadow)}
.unalloc .emoji{background:var(--ok-soft);color:var(--ok)}
/* ---- game layer (v4: restrained) ---- */
.mascot{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.pig{flex:none;line-height:0}.pig .logo{width:32px;height:32px}
.bubble{font-size:14px;flex:1;color:var(--text)}
.tiplabel{display:block;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--muted);margin-bottom:2px}
.card.game{background:var(--card)}
.lvl{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;line-height:1;flex:none}
.lvl small{display:block;font-size:12px;font-weight:600;letter-spacing:.8px;margin-top:3px;opacity:.8}
.xpbar{height:4px;background:var(--fill);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.xpbar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.xpbar.light{background:var(--ink-soft)} .xpbar.light>i{background:var(--on-ink)}
.xpbar.big{height:6px;margin-top:14px}
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.streak{background:var(--fill);border-radius:10px;padding:10px 8px;text-align:center}
.streak b{display:flex;align-items:center;justify-content:center;gap:5px;font-size:18px;font-weight:700}
.streak b svg.i{color:var(--muted)}
.streak span{font-size:12px;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--fill);border-radius:99px;padding:3px 10px 3px 3px;font-size:13px;display:inline-flex;align-items:center}
.chip.me{box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip b{font-weight:600;margin-left:4px;color:var(--muted)}
.hero.fun{background:var(--ink)}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)} .mrow:last-child{border-bottom:none}
.srow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .srow:last-child{border-bottom:none}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trophy{background:var(--card);border-radius:14px;padding:14px 8px 12px;text-align:center;color:var(--muted);min-height:126px;box-shadow:var(--shadow)}
.trophy .te{width:44px;height:44px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--muted)}
.trophy .te svg.i{width:20px;height:20px}
.trophy .tn{font-weight:600;font-size:13px;margin-top:8px;color:var(--text)}
.trophy .th{font-size:12px;line-height:1.3;margin-top:3px}
.trophy.got .te{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.trophy:not(.got){opacity:.85}
.chal.done{box-shadow:inset 0 0 0 1px var(--gold),var(--shadow)}
.card.coach .emoji{background:var(--ok-soft);color:var(--ok)}
.idea .links{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.idea .links a{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pts{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-bottom:10px;color:var(--text)}
.pts b{font-weight:600;text-align:right;color:var(--accent-ink)}
.cele{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-12px);opacity:0;z-index:70;pointer-events:none;
  background:var(--card);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);
  width:min(92vw,420px);transition:opacity .25s,transform .3s ease-out;border:1px solid var(--line)}
.cele.show{opacity:1;transform:translate(-50%,0)}
.cele-emoji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.cele.badge .cele-emoji,.cele.challenge .cele-emoji,.cele.goal .cele-emoji{background:var(--gold-soft);color:var(--gold)}
.cele.payday .cele-emoji{background:var(--ok-soft);color:var(--ok)}
.cele-title{font-weight:650;font-size:15px}
.cele-sub{font-size:13px;color:var(--muted)}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:65;display:none}
.toggle{display:flex!important;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:500!important;color:var(--text)!important;font-size:15px!important}
.toggle span{display:inline-flex;align-items:center;gap:8px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.card.payday{box-shadow:inset 0 0 0 1px var(--ok),var(--shadow)}
.card.payday .emoji{background:var(--ok-soft);color:var(--ok)}
.card.payday.alldone{box-shadow:var(--shadow)}
.card.payday.alldone .emoji{background:var(--fill);color:var(--muted)}
.card.payday .xpbar>i{background:var(--ok)}
.tlist{margin-top:8px}
.titem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.titem:last-child{border-bottom:none}
.titem input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin:1px 0 0}
.titem.done .grow{text-decoration:line-through;color:var(--muted)}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.paygrid input,.paygrid select,.acctrow input{width:100%;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:9px;font-size:15px}
.earner{background:var(--fill);border-radius:12px;padding:10px;margin-bottom:8px}
.acctrow{display:grid;grid-template-columns:1.1fr 1.6fr 1fr;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.nextpay .emoji{background:var(--fill);color:var(--muted)}
.card[data-goal] .emoji{color:var(--ok)}

function parseBackup(text){

var OBS_KEY=KEY+'.onboarding';
function obIncome(){ // monthly take-home from what's typed on the budget step
  var tot=0, any=false;
  (OB.earners||[]).forEach(function(e,i){ var a=document.querySelector('#onb [name=ob_ea_'+i+']'), f=document.querySelector('#onb [name=ob_ef_'+i+']');
    var v=a?parseAmt(a.value):parseAmt(e.amount), fr=f?f.value:e.freq; if(v>0){ any=true; tot+=v*(PPM[fr]||1); } });
  return any?round2(tot):0;
}
function obEnvTotal(){ var t=0; (OB.envs||[]).forEach(function(e,i){ var c=document.querySelector('#onb [name=ob_ev_'+i+']'), a=document.querySelector('#onb [name=ob_eam_'+i+']');
  if(c?c.checked:e.on) t+=a?(parseAmt(a.value)||0):(+e.amount||0); }); return round2(t); }
function obBudgetSum(){
  var inc=obIncome(), env=obEnvTotal();
  if(!inc) return 'Envelopes: <b>'+money(env)+'</b> a month. Add your pay above to check it fits.';
  var left=round2(inc-env);
  return 'Pay about <b>'+money(inc)+'</b> a month · envelopes <b>'+money(env)+'</b> · '+(left>=0?'<b>'+money(left)+'</b> left for goals and buffer.':'<b class="neg">'+money(-left)+' more than your pay</b>. Lower some amounts.');
}
function obScale(){
  var inc=obIncome(); if(!inc) return;
  var base=0, idx=[];
  OB.envs.forEach(function(e,i){ var a=document.querySelector('#onb [name=ob_eam_'+i+']'), c=document.querySelector('#onb [name=ob_ev_'+i+']'); if(a && !a.hasAttribute('data-touched') && e.base && (!c||c.checked)){ base+=e.base; idx.push(i); } });
  if(!base) return;
  var k=Math.min(1,(inc*0.8-(obEnvTotal()-idx.reduce(function(s,i){ var a=document.querySelector('#onb [name=ob_eam_'+i+']'); return s+(parseAmt(a.value)||0); },0)))/base); if(k<0) k=0;
  idx.forEach(function(i){ var a=document.querySelector('#onb [name=ob_eam_'+i+']'), v=Math.max(0,(k<1?Math.floor(OB.envs[i].base*k/5+1e-9):Math.round(OB.envs[i].base*k/5))*5); a.value=v; OB.envs[i].amount=v; });
}

/* =====================================================================
   v6: CALENDAR - birthdays, bills, renewals and other critical dates.
   Paydays (from the pay schedule) and goal deadlines (from goal target dates) are added automatically.
   ===================================================================== */
var EVT={
  birthday:{label:'Birthday',ic:'gift',repeat:'yearly',remind:7},
  anniversary:{label:'Anniversary',ic:'heart',repeat:'yearly',remind:7},
  bill:{label:'Bill due',ic:'receipt',repeat:'monthly',remind:3},
  renewal:{label:'Renewal',ic:'refresh',repeat:'yearly',remind:14},
  school:{label:'School/Event',ic:'book',repeat:'none',remind:1},
  other:{label:'Other',ic:'bookmark',repeat:'none',remind:1},
  payday:{label:'Payday',ic:'wallet',auto:true},
  goal:{label:'Goal deadline',ic:'target',auto:true}
};
var EVT_ORDER=['birthday','anniversary','bill','renewal','school','other','payday','goal'];
var EVT_USER=['birthday','anniversary','bill','renewal','school','other'];
var REPEATS=[['none','Does not repeat'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly'],['yearly','Yearly']];
var REMINDS=[[0,'On the day'],[1,'1 day before'],[3,'3 days before'],[7,'1 week before'],[14,'2 weeks before']];
var CAL_WINDOW=30, ISO_RE=/^\d{4}-\d{2}-\d{2}$/;

function dayDiff(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function shiftISO(iso,rep,k){
  if(rep==='weekly') return addDays(iso,7*k);
  if(rep==='fortnightly') return addDays(iso,14*k);
  var p=iso.split('-').map(Number), y=p[0], m=p[1]-1, d=p[2];
  if(rep==='monthly'){ m+=k; y+=Math.floor(m/12); m=((m%12)+12)%12; } else if(rep==='yearly') y+=k;
  var last=new Date(y,m+1,0).getDate(); // 31st -> last day of shorter months, 29 Feb -> 28 Feb

/* Every date a (possibly repeating) item falls on between from and to (inclusive). past: also go back before the start date. */
function occur(base,rep,from,to,past){

  if(!rep||rep==='none'||!REPEATS.some(function(r){return r[0]===rep;})) return (base>=from&&base<=to)?[base]:[];
  var per={weekly:7,fortnightly:14}[rep], k0;
  if(per) k0=Math.floor(dayDiff(base,from)/per)-1;
  else if(rep==='monthly') k0=(+from.slice(0,4)-base.slice(0,4))*12+(+from.slice(5,7)-base.slice(5,7))-1;
  else k0=+from.slice(0,4)-base.slice(0,4)-1;
  if(!past) k0=Math.max(0,k0);
  var out=[];
  for(var k=k0,g=0;g<600;k++,g++){ var d=shiftISO(base,rep,k); if(d>to) break; if(d>=from) out.push(d); }
  return out;
}

      h+='<button type="button" class="cday'+(iso===t?' today':'')+(iso===sel?' sel':'')+(iso<t?' past':'')+(items.length?' has':'')+'" data-action="calday" data-id="'+iso+'" data-day="'+iso+'" data-n="'+items.length+'" aria-label="'+esc(longDate(iso)+(items.length?', '+items.length+' item'+(items.length===1?'':'s'):''))+'">'+

  } else {

function saveEvent(e){
  var type=fval('type'); if(EVT_USER.indexOf(type)<0) type='other';

  var fq=function(n){ return document.querySelector('#sheetForm [name="'+n+'"]'); };
  if(!title) return sheetErr('Give it a title.',fq('title'));

document.addEventListener('click',function(ev){

  var a=t.getAttribute('data-action'), id=t.getAttribute('data-id');
  if(a==='newevent'){ ev.preventDefault(); sEvent(null, S.tab==='calendar'&&S.calView!=='agenda'&&S.calDay?S.calDay:''); }
  else if(a==='openevent'){
    var e=evSeriesById(id); if(!e) return;
    if(!e.auto && canEditEvent(e)) sEvent(id); else sEventView(id,t.getAttribute('data-date'));
  }
  else if(a==='delevent') delEvent(id);
  else if(a==='calview'){ S.calView=id==='agenda'?'agenda':'month'; save(); render(); }
  else if(a==='calmonth'){ var cm=S.calMonth&&/^\d{4}-\d{2}$/.test(S.calMonth)?S.calMonth:todayISO().slice(0,7); var nm=shiftISO(cm+'-01','monthly',+id).slice(0,7); S.calMonth=nm; S.calDay=nm===todayISO().slice(0,7)?todayISO():nm+'-01'; save(); render(); }
  else if(a==='calday'){ S.calDay=id; S.calMonth=id.slice(0,7); save(); render(); }
  else if(a==='calmore'){ ev.preventDefault(); S.calSpan=(S.calSpan||60)+60; render(); }
  else if(a==='giftenv'){ sEnvelope(null); var n=document.querySelector('#sheetForm [name=name]'); if(n) n.value='Gifts'; var gi=document.querySelector('#sheetForm [name=icon][value=gift]'); if(gi) gi.checked=true; }

function isAdmin(m){ return can('editBudget',m); } // v5: budget editing is a permission
function member(id){ for(var i=0;i<S.members.length;i++) if(S.members[i].id===id) return S.members[i]; return null; }
function env(id){ for(var i=0;i<S.envelopes.length;i++) if(S.envelopes[i].id===id) return S.envelopes[i]; return null; }

function mname(id){ var m=member(id); return m?m.name:((S&&S.former&&S.former[id])||'Someone'); }
function adminCount(){ return S.members.filter(function(m){return m.role==='admin';}).length; }
function log(icon,text){ S.activity.unshift({id:uid(),ts:Date.now(),actor:S.currentUser,icon:icon,text:text}); if(S.activity.length>500) S.activity.length=500; }
function pending(){ return S.requests.filter(function(r){return r.status==='pending';}); }
function totals(){
  var e=S.envelopes.reduce(function(a,x){return a+x.balance;},0);
  var g=S.goals.reduce(function(a,x){return a+x.saved;},0);
  var u=S.unallocated||0;
  return {env:round2(e),goals:round2(g),unalloc:round2(u),all:round2(e+g+u)};
}
function pct(a,b){ if(!b||b<=0) return 0; return Math.max(0,Math.min(100,a/b*100)); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2200); }
/* Can the current user decide this request? Admins can't approve their own request unless they're the only admin. */
function canDecide(r){
  if(!can('approve')) return false;
  if(r.memberId===S.currentUser && approverCount()>1) return false;
  return true;
}

/* ---------- sheets (forms) ---------- */
var sheetSubmit=null;
function openSheet(title,body,submitLabel,onSubmit,extraBtns){
  var sh=document.getElementById('sheet');
  sh.innerHTML='<div class="grab"></div><h3>'+esc(title)+'</h3><form id="sheetForm" novalidate>'+body+
    '<div class="err" id="sheetErr"></div>'+
    (submitLabel?'<button type="submit" class="btn primary block">'+esc(submitLabel)+'</button>':'')+
    (extraBtns||'')+
    '<button type="button" class="btn ghost block" data-action="close">Cancel</button></form>';
  sheetSubmit=onSubmit; sheetLive=null;
  document.getElementById('scrim').classList.add('open');
  var first=sh.querySelector('input:not([type=hidden]),select,textarea');

}
function closeSheet(){ document.getElementById('scrim').classList.remove('open'); sheetSubmit=null; sheetLive=null; }
function sheetErr(msg,el){
  var box=document.getElementById('sheetErr'); if(!box) return;
  box.textContent=msg||''; box.setAttribute('role','alert');
  document.querySelectorAll('#sheetForm .ferr').forEach(function(x){ x.remove(); });
  document.querySelectorAll('#sheetForm [aria-invalid]').forEach(function(x){ x.removeAttribute('aria-invalid'); });
  if(!msg) return;
  var t=document.getElementById('toast'); if(t){ t.classList.remove('show'); clearTimeout(toast._t); } // an error is never hidden behind a toast
  if(el){
    el.setAttribute('aria-invalid','true');
    var fe=document.createElement('div'); fe.className='ferr'; fe.setAttribute('role','alert'); fe.textContent=msg;
    (el.closest('.earner,.field,.acctrow')||el.parentNode).appendChild(fe);
    try{ fe.scrollIntoView({block:'center'}); }catch(e){}
    try{ el.focus({preventScroll:true}); }catch(e){}
  } else { try{ box.scrollIntoView({block:'center'}); }catch(e){} }
}
var sheetLive=null;
function fval(name){ var el=document.querySelector('#sheetForm [name="'+name+'"]:checked')||document.querySelector('#sheetForm [name="'+name+'"]:not([type=radio])'); return el?el.value.trim():''; }
var FID=0;
function field(label,html,hint){ // every label is tied to its control (or names the group of radio buttons)
  var id='f'+(++FID), hi=hint?'<div class="hint">'+esc(hint)+'</div>':'';
  if(/type="radio"/.test(html)) return '<div class="field" role="group" aria-labelledby="'+id+'"><label id="'+id+'">'+esc(label)+'</label>'+html+hi+'</div>';
  var m=html.match(/<(input|select|textarea)\b([^>]*)>/);
  if(m){ var im=m[2].match(/\sid="([^"]+)"/); if(im) id=im[1]; else html=html.replace(/<(input|select|textarea)\b/,'<$1 id="'+id+'"'); }
  return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+html+hi+'</div>'; }
function amtInput(name,val){ return '<input name="'+name+'" inputmode="decimal" placeholder="$0.00" value="'+(val!=null?esc(val):'')+'">'; }

function sRequest(envId){
  if(!can('request')) return toast('You don\'t have permission to request funds');
  if(!S.envelopes.length){ toast('There are no envelopes yet'); return; }
  var rec=!requestsOn(), lim=can('autoApprove');
  var opts=S.envelopes.map(function(e){return '<option value="'+e.id+'"'+(e.id===envId?' selected':'')+'>'+esc(e.name)+(seesEnv(e)?' ('+money(e.balance)+' left)':'')+'</option>';}).join('');
  openSheet(rec?'Record spending':'Request funds',
    (!rec&&lim>0?'<div class="banner info">Requests up to '+money(lim)+' are approved automatically if the envelope has enough in it.</div>':'')+
    field('Envelope','<select name="env">'+opts+'</select>')+
    field('Amount (AUD)',amtInput('amount'))+
    field(rec?'What was it for?':'What is it for?','<textarea name="reason" rows="2" maxlength="140" placeholder="'+(rec?'e.g. Weekly shop':'e.g. School excursion on Friday')+'"></textarea>'),
    rec?'Record spending':'Send request',function(){
      var e=env(fval('env')), a=parseAmt(fval('amount')), reason=fval('reason');
      if(!e) return sheetErr('Pick an envelope.',document.querySelector('#sheetForm [name=env]'));
      if(!(a>0)) return sheetErr('Enter an amount more than $0.',document.querySelector('#sheetForm [name=amount]'));
      if(!reason && !rec) return sheetErr('Add a short reason so the admins know what it\'s for.',document.querySelector('#sheetForm [name=reason]'));
      var r={id:uid(),memberId:S.currentUser,envelopeId:e.id,amount:a,reason:reason||'Spending',status:'pending',createdAt:Date.now()};
      if(rec){ // no approvals in this household: spending comes straight off the envelope
        r.status='approved'; r.decidedBy=S.currentUser; r.decidedAt=r.createdAt; r.auto='record';
        e.balance=round2(e.balance-a); S.requests.push(r);
        log('receipt','spent '+money(a)+' from '+e.name+(reason?': "'+reason+'"':'')+(e.balance<0?' (now overspent)':''));
        noteOverspend(); updateBest();
        award(S.currentUser,5,'request'); sfx('coin');
        return done('Recorded '+money(a)+' from '+e.name+'.');
      }
      if(lim>0 && a<=lim+0.001 && a<=e.balance+0.001){ // under this member's auto-approve limit
        r.status='approved'; r.decidedBy=S.currentUser; r.decidedAt=r.createdAt; r.auto='limit'; r.note='';
        e.balance=round2(e.balance-a); S.requests.push(r);
        log('check-circle','requested '+money(a)+' from '+e.name+': "'+reason+'" (approved automatically, under the '+money(lim)+' limit)');
        award(S.currentUser,5,'request'); grant('good_asker',S.currentUser); sfx('coin');
        S.tab='requests'; S.reqFilter='all';
        return done('Approved automatically. '+money(a)+' from '+e.name+'.');
      }
      if(can('approve') && approverCount()<=1 && a<=e.balance+0.001){
        r.status='approved'; r.decidedBy=S.currentUser; r.decidedAt=r.createdAt; r.auto='self'; r.note='';
        e.balance=round2(e.balance-a); S.requests.push(r);
        log('check-circle','took '+money(a)+' from '+e.name+': "'+reason+'" (approved automatically, as the only approver)');
        award(S.currentUser,5,'request'); sfx('coin');
        S.tab='requests'; S.reqFilter='all';
        return done('Approved automatically (you\'re the only approver). '+money(a)+' from '+e.name+'.');
      }
      S.requests.push(r);
      log('hand','requested '+money(a)+' from '+e.name+': "'+reason+'"');
      award(S.currentUser,5,'request'); grant('good_asker',S.currentUser); sfx('pop');
      S.tab='requests'; S.reqFilter='pending';
      done('Request sent. Waiting for an admin.');
    });
}
function sDecide(id,approve){
  var r=req(id); if(!r||r.status!=='pending') return;
  if(!canDecide(r)) return toast('Only an admin can do that');
  var e=env(r.envelopeId);
  var info='<div class="banner info"><b>'+esc(mname(r.memberId))+'</b> wants <b>'+money(r.amount)+'</b> from '+esc(e?e.name:'a deleted envelope')+':<br>“'+esc(r.reason)+'”'+
    (e?'<br><span class="small">Balance now '+money(e.balance)+(approve?', after approval '+money(round2(e.balance-r.amount)):'')+'</span>':'')+'</div>';
  openSheet(approve?'Approve request':'Decline request',
    info+field('Note (optional)','<input name="note" maxlength="140" placeholder="'+(approve?'e.g. Enjoy!':'e.g. Let\'s wait until payday')+'">'),
    approve?'Approve '+money(r.amount):'Decline',function(){
      var note=fval('note');
      if(approve){
        if(!e) return sheetErr('That envelope no longer exists, so this can\'t be approved.');
        if(r.amount>e.balance+0.001) return sheetErr('Not enough in '+e.name+' ('+money(e.balance)+' left). Add money to the envelope first, or decline.');
        e.balance=round2(e.balance-r.amount);
      }
      r.status=approve?'approved':'declined'; r.decidedBy=S.currentUser; r.decidedAt=Date.now(); r.note=note;
      log(approve?'check-circle':'x-circle',(approve?'approved ':'declined ')+mname(r.memberId)+'\'s request for '+money(r.amount)+' from '+(e?e.name:'a deleted envelope')+(note?'. Note: "'+note+'"':''));
      if(approve){ award(S.currentUser,10,'decide'); grant('team_player',S.currentUser); sfx('coin'); confetti('small'); }
      else { award(S.currentUser,5,'decide'); sfx('soft'); }
      done(approve?'Approved. '+money(r.amount)+' taken from '+e.name+'.':'Request declined.');
    });
}
function cancelReq(id){
  var r=req(id); if(!r||r.status!=='pending'||r.memberId!==S.currentUser) return;
  r.status='cancelled'; r.decidedBy=S.currentUser; r.decidedAt=Date.now();
  var e=env(r.envelopeId);
  log('rotate','cancelled their request for '+money(r.amount)+' from '+(e?e.name:'an envelope'));

function monthPlan(ratio){
  var k=ratio==null?1:Math.max(0,Math.min(1,ratio));
  return S.envelopes.map(function(e){
    var g=rollGoal(e), left=round2(e.balance), alloc=S.pay.fundOn==='payday'?0:(k<1?Math.floor(e.monthly*k*100+1e-6)/100:round2(e.monthly));
    if(g && left>0) return {e:e,g:g,move:left,newBal:round2(alloc),alloc:alloc};
    return {e:e,g:g,move:0,keep:left,newBal:round2(left+alloc),alloc:alloc};
  });
}
function sTopUp(){

    '<input name="income" inputmode="decimal" placeholder="$0.00 (optional)" aria-label="Income to add to Unallocated first">'+

    '<div class="fundopts" id="fundOpts">'+
      '<label class="radrow"><input type="radio" name="fund" value="full" checked><span><b>Fund every envelope in full</b><small id="fullNote">Unallocated income goes below $0 until more money comes in.</small></span></label>'+
      '<label class="radrow"><input type="radio" name="fund" value="avail"><span><b>Fund only what\'s available</b><small id="availNote">Each envelope gets the same share of its monthly amount.</small></span></label>'+
    '</div></div>';
  openSheet('Start new month',
    '<div class="banner info">'+(pay?'Your envelopes are filled on each payday, so this step only handles rollovers.':'Each envelope gets its monthly allocation ('+money(tot)+' in total) from Unallocated income.')+' Envelopes set to roll over send their leftover to a goal first'+(moved?' ('+money(moved)+' in total)':'')+'. Check the summary, then confirm.</div>'+
    fundUI+'<ul class="sumlist" id="monthSummary">'+items(plan)+'</ul>',
    'Confirm and start new month',function(){
      var inc=fval('income')===''?0:parseAmt(fval('income'));
      if(!(inc>=0)) return sheetErr('Income must be a number ($0 or more), or leave it blank.',document.querySelector('#sheetForm [name=income]'));
      if(inc>0){ S.unallocated=round2((S.unallocated||0)+inc); log('banknote','recorded '+money(inc)+' of income for the new month'); }
      var avail=Math.max(0,round2(S.unallocated||0)), ratio=1, partial=false;
      if(!pay && tot>avail+0.004 && fval('fund')==='avail'){ ratio=tot>0?avail/tot:0; partial=true; }

/* ---------- bank: matching ---------- */
function uncat(){ return S.txns.filter(function(t){return t.status==='uncat';}); }
function txn(id){ for(var i=0;i<S.txns.length;i++) if(S.txns[i].id===id) return S.txns[i]; return null; }
function norm(s){ return ' '+String(s||'').toLowerCase().replace(/[^a-z0-9&'\- ]+/g,' ').replace(/\s+/g,' ').trim()+' '; }
function matchRule(desc){
  var d=norm(desc);
  // longest keyword wins, so a remembered "bunnings rockingham" beats a generic rule
  var best=null;
  S.rules.forEach(function(r){
    var k=r.kw.toLowerCase();
    var hit=d.indexOf(' '+norm(k).trim())>=0; // keyword must start a word
    if(hit && env(r.envelopeId) && (!best || r.kw.length>best.kw.length)) best=r;
  });
  return best;
}
/* Applies one incoming bank transaction: spending -> envelope by rule (or Uncategorised), money in -> Unallocated income. */
function looksTransfer(desc){
  var d=String(desc||'');
  return /\b(transfer|tfr|xfer|trf|trnsfr)\b/i.test(d) || /\b(from|to) (my )?(savings|everyday|offset|cheque|account|acct|credit card)\b/i.test(d) || /\binternal\b/i.test(d);
}
function skipTx(t){ return t.status==='ignored' || t.status==='transfer'; }
function applyTxn(t){
  var src=t.source==='demo'?'demo bank':'statement import';
  if(looksTransfer(t.desc)){ // money moving between your own accounts: no balance changes
    t.status='transfer';
    log('repeat',money(Math.abs(t.amount))+' '+t.desc+' ('+src+') looks like a transfer between accounts, so it isn\'t counted as '+(t.amount>0?'income':'spending'));
    return 'transfer';
  }
  if(t.amount>0){
    t.status='income';
    S.unallocated=round2((S.unallocated||0)+t.amount);
    log('banknote',money(t.amount)+' came in ('+t.desc+', '+src+') and went to Unallocated income');
    return 'income';
  }
  var r=matchRule(t.desc);
  if(r){
    var e=env(r.envelopeId);
    t.status='matched'; t.envelopeId=e.id;
    e.balance=round2(e.balance+t.amount); noteOverspend();
    log('bank',money(-t.amount)+' at '+t.desc+' ('+src+') auto-matched to '+e.name+' (now '+money(e.balance)+')');
    return 'matched';
  }
  t.status='uncat';
  log('help',money(-t.amount)+' at '+t.desc+' ('+src+') needs an envelope (Uncategorised)');
  return 'uncat';
}
function ingest(list,source,accountId){
  var seen={}; S.txns.forEach(function(t){ seen[t.key]=1; });
  var res={added:0,dupes:0,matched:0,income:0,uncat:0,transfer:0,incomeAmt:0};
  list.forEach(function(x){
    if(seen[x.key]){ res.dupes++; return; }
    seen[x.key]=1;
    var t={id:uid(),key:x.key,date:x.date,desc:x.desc,amount:round2(x.amount),source:source,accountId:accountId||'',importedAt:Date.now()};
    S.txns.unshift(t);
    var k=applyTxn(t); res[k]++; res.added++; if(k==='income') res.incomeAmt=round2(res.incomeAmt+t.amount);
  });
  S.txns.sort(function(a,b){ return (b.date>a.date?1:b.date<a.date?-1:0) || b.importedAt-a.importedAt; });
  if(S.txns.length>1500) S.txns.length=1500;
  return res;
}
function resultMsg(r){
  if(!r.added) return 'No new transactions'+(r.dupes?' ('+r.dupes+' already imported, skipped)':'');
  return r.added+' new: '+r.matched+' auto-matched, '+r.income+' income, '+r.uncat+' to sort'+(r.transfer?', '+r.transfer+' transfer'+(r.transfer===1?'':'s')+' between accounts':'')+(r.dupes?', '+r.dupes+' duplicates skipped':'');
}

/* ---------- bank: CSV statement import ---------- */
function parseCSV(text){
  var rows=[],row=[],f='',q=false,i,c;
  text=String(text).replace(/^\uFEFF/,'');
  var first=text.split(/\r?\n/)[0]||'', sep=','; // auto-detect ; or tab exports
  if(first.split(';').length>first.split(',').length) sep=';'; else if(first.split('\t').length>first.split(',').length) sep='\t';
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.map(function(r){return r.map(function(x){return x.trim();});}).filter(function(r){return r.some(function(x){return x!=='';});});
}
var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDateAU(s){
  s=String(s||'').trim(); var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){ var y=+m[3]; if(y<100) y+=2000; return iso(y,+m[2],+m[1]); }
  if((m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-](\d{2,4})$/))){ var yy=+m[3]; if(yy<100) yy+=2000; var mo=MON[m[2].toLowerCase()]; if(mo) return iso(yy,mo,+m[1]); }
  return null;
  function iso(y,mo,d){ if(mo<1||mo>12||d<1||d>31) return null; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
}
function parseMoney(s){
  s=String(s||'').trim(); if(!s) return NaN;
  var neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(/\bDR\b/i.test(s)){ neg=true; } s=s.replace(/\b(DR|CR)\b/ig,'');
  s=s.replace(/[$,\s]/g,''); if(s.charAt(0)==='+') s=s.slice(1);
  var n=parseFloat(s); if(!isFinite(n)) return NaN;
  return round2(neg?-Math.abs(n):n);
}
/* Understands: ING Australia (Date,Description,Credit,Debit,Balance), generic Date,Amount,Description,
   any header with Date + Description/Narrative/Details + Amount or Debit/Credit columns,
   and CommBank's header-less export (Date,Amount,Description,Balance). */
function parseStatement(text){
  var rows=parseCSV(text); if(!rows.length) return {error:'That file is empty.'};
  var h=rows[0].map(function(x){return x.toLowerCase().replace(/[^a-z ]/g,'').trim();});
  var find=function(names){ for(var i=0;i<h.length;i++) for(var j=0;j<names.length;j++) if(h[i]===names[j]||h[i].indexOf(names[j])===0) return i; return -1; };
  var cDate=find(['date','transaction date','posted date','effective date']);
  var cDesc=find(['description','narrative','details','transaction details','memo','payee','merchant']);
  var cAmt=find(['amount','transaction amount','value']);
  var cDeb=find(['debit','withdrawal','money out','debits']);
  var cCred=find(['credit','deposit','money in','credits']);
  var cBal=find(['balance']);
  var body=rows.slice(1), fmt='';
  if(cDate<0 && parseDateAU(rows[0][0])){ // header-less, CommBank style
    cDate=0; cAmt=1; cDesc=2; cBal=rows[0].length>3?3:-1; body=rows; fmt='CommBank (no header)';
  } else if(cDate<0 || cDesc<0 || (cAmt<0 && cDeb<0 && cCred<0)){
    return {error:'Couldn\'t find Date, Description and Amount (or Debit/Credit) columns in that file.'};
  } else fmt=(cCred>=0||cDeb>=0)&&cAmt<0?(h.join(',')==='date,description,credit,debit,balance'?'ING Australia':'Debit/Credit columns'):'Date, Amount, Description';
  var out=[],bad=0,occ={};
  body.forEach(function(r){
    var d=parseDateAU(r[cDate]), desc=(r[cDesc]||'').replace(/\s+/g,' ').trim(), amt=NaN;
    if(cAmt>=0 && r[cAmt]!==undefined && r[cAmt]!=='') amt=parseMoney(r[cAmt]);
    else {
      var cr=cCred>=0?parseMoney(r[cCred]):NaN, db=cDeb>=0?parseMoney(r[cDeb]):NaN;
      if(isFinite(cr)&&cr!==0) amt=Math.abs(cr); else if(isFinite(db)&&db!==0) amt=-Math.abs(db);
    }
    if(!d || !desc || !isFinite(amt) || amt===0){ bad++; return; }
    var base='csv|'+d+'|'+amt.toFixed(2)+'|'+desc.toLowerCase()+(cBal>=0&&r[cBal]?'|'+r[cBal]:'');
    occ[base]=(occ[base]||0)+1; // identical rows in one file (two $5 coffees) are kept apart
    out.push({key:base+'#'+occ[base],date:d,desc:desc,amount:amt});
  });
  return {rows:out,bad:bad,format:fmt};
}
function importCSVText(text,fileName){
  if(!can('addTx')) return toast('Only an admin can import');
  var p=parseStatement(text);
  if(p.error){ toast(p.error); return p; }
  if(!p.rows.length){ var nm='No transactions found in that file'+(p.bad?' ('+p.bad+' row'+(p.bad===1?'':'s')+' couldn\'t be read: check the dates and amounts)':'')+'.'; toast(nm); return {added:0,bad:p.bad,error:nm}; }
  var r=ingest(p.rows,'csv','');
  award(S.currentUser,5,'bank'); grant('bank_buddy',S.currentUser); checkNoTakeaway(); sfx('ding');
  log('file','imported a bank statement'+(fileName?' ('+fileName+')':'')+', '+p.format+' format: '+resultMsg(r)+(p.bad?', '+p.bad+' unreadable rows skipped':''));
  S.tab='bank'; S.bankFilter='all';
  done('Statement imported. '+resultMsg(r)+(p.bad?'. '+p.bad+' unreadable row'+(p.bad===1?'':'s')+' skipped':''));
  r.format=p.format; r.bad=p.bad; return r;
}
function importCSVFile(file,input){
  var rd=new FileReader();
  rd.onload=function(){ importCSVText(String(rd.result),file.name); if(input) input.value=''; };
  rd.onerror=function(){ toast('Couldn\'t read that file'); };
  rd.readAsText(file);
}

function ignoreTxn(id,as){

/* Undo what a transaction did to the budget, so it can be re-labelled. */
function unapplyTxn(t){
  if(t.status==='income') S.unallocated=round2((S.unallocated||0)-t.amount);
  else if(t.status==='matched'||t.status==='assigned'){ var e=env(t.envelopeId); if(e) e.balance=round2(e.balance-t.amount); }
  t.envelopeId='';
}
var TX_LABEL={income:'Income',transfer:'Transfer between accounts',ignored:'Ignored',matched:'Spending',assigned:'Spending',uncat:'Uncategorised'};
function markTxn(id,to){
  var t=txn(id); if(!t||!can('addTx')||t.status==='history'||t.status===to) return;
  var was=t.status; unapplyTxn(t);
  if(to==='income'){ if(!(t.amount>0)) return; t.status='income'; S.unallocated=round2((S.unallocated||0)+t.amount); }
  else if(to==='uncat'){ if(!(t.amount<0)) return; t.status='uncat'; }
  else t.status=to==='transfer'?'transfer':'ignored';
  log('repeat','changed '+t.desc+' ('+money(Math.abs(t.amount))+') from '+TX_LABEL[was]+' to '+(TX_LABEL[t.status]||t.status)+(was==='income'?'. Unallocated is now '+money(S.unallocated):''));
  if(to==='uncat'){ save(); render(); return sSortTxn(t.id); }
  noteOverspend();
  done((to==='transfer'?'Marked as a transfer between accounts':to==='income'?'Counted as income':'Ignored')+(was==='income'&&S.unallocated<-0.004?'. Unallocated is now '+money(S.unallocated):''));
}
function sFixTxn(id){

  if(t.status!=='ignored') o.push(['ignored','Ignore','Leave it out of the budget completely.']);
  if(t.amount>0 && t.status!=='income') o.push(['income','Count as income','Adds '+money(t.amount)+' to Unallocated income.']);
  if(t.amount<0) o.push(['uncat',e?'Choose a different envelope':'Take it from an envelope','Counts as spending from the envelope you pick.']);
  var now=t.status==='income'?'Counted as income ('+money(t.amount)+' went to Unallocated).':t.status==='transfer'?'Treated as a transfer between your accounts (not counted).':t.status==='ignored'?'Ignored (not counted).':'Spending from '+(e?e.name:'an envelope')+'.';

    field('What is it?',o.map(function(x,i){ return '<label class="radrow"><input type="radio" name="as" value="'+x[0]+'"'+(i?'':' checked')+'><span><b>'+x[1]+'</b><small>'+x[2]+'</small></span></label>'; }).join('')),

var fxLog=[], pendSounds=[], pendConfetti=null, celeQ=[], celeBusy=false, pendXp=0;
var SOUND_RANK=['soft','pop','ding','coin','badge','fanfare'];
function sfx(n){ pendSounds.push(n); }

function cele(o){ if(!gameOn()&&o.kind!=='payday'){ fxLog.push('cele-skip:'+o.kind); return; } celeQ.push(o); fxLog.push('cele:'+o.kind); if(celeQ.length>2) celeQ.splice(0,celeQ.length-2); } // only the 2 newest wait, so cards never pile up

/* Sounds are synthesised with the Web Audio API: no files. */
var AC=null;
function audio(){
  if(!AC){
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){} // follows the iPhone silent switch where supported
    try{ AC=new C(); }catch(e){ return null; }
  }
  if(AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
var SOUNDS={
  soft:[[440,0,.12,'sine',.035,392]],
  pop:[[660,0,.08,'sine',.05,880]],
  ding:[[1318,0,.45,'sine',.045],[1976,0,.25,'sine',.012]],
  coin:[[880,0,.09,'sine',.04],[1318,.07,.3,'sine',.04]],
  badge:[[659,0,.14,'sine',.045],[880,.11,.14,'sine',.045],[1318,.22,.5,'sine',.045]],
  fanfare:[[523,0,.18,'sine',.05],[659,.13,.18,'sine',.05],[784,.26,.18,'sine',.05],[1047,.39,.6,'sine',.055],[1568,.39,.5,'sine',.012]]
};
function playSound(n){
  if(!S.settings.sound || !SOUNDS[n]) return;
  fxLog.push('sound:'+n);
  var c=audio(); if(!c) return;
  try{
    SOUNDS[n].forEach(function(a){
      var o=c.createOscillator(), g=c.createGain(), t=c.currentTime+a[1];
      o.type=a[3]; o.frequency.setValueAtTime(a[0],t); if(a[5]) o.frequency.exponentialRampToValueAtTime(a[5],t+a[2]);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(a[4],t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+a[2]);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+a[2]+0.05);
    });
  }catch(e){}
}
/* Confetti on a <canvas>: skipped entirely if the phone asks for reduced motion or celebrations are off. */
function runConfetti(size){
  if(!S.settings.motion || reducedMotion()){ fxLog.push('confetti:skipped'); return; }
  fxLog.push('confetti:'+size);
  var cv=document.getElementById('fx'), ctx=cv.getContext && cv.getContext('2d'); if(!ctx) return;
  var W=cv.width=window.innerWidth*(window.devicePixelRatio||1), H=cv.height=window.innerHeight*(window.devicePixelRatio||1), k=window.devicePixelRatio||1;
  var cols=['#4f46e5','#818cf8','#10b981','#f59e0b','#cbd5e1'];
  var n=size==='big'?60:24, P=[];
  for(var i=0;i<n;i++) P.push({x:W*(size==='big'?.15+Math.random()*.7:.35+Math.random()*.3),y:-10*k-Math.random()*H*.12,vx:(Math.random()-.5)*3*k,vy:(2.5+Math.random()*3)*k,r:(3+Math.random()*3)*k,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[i%cols.length],s:Math.random()<.5});
  var t0=performance.now(); cv.style.display='block';
  (function frame(t){
    var el=t-t0; ctx.clearRect(0,0,W,H);
    P.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05*k; p.vx*=.995; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-el/1200);
      if(p.s) ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { ctx.beginPath(); ctx.arc(0,0,p.r/2.4,0,6.3); ctx.fill(); } ctx.restore(); });
    if(el<1200) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.style.display='none'; }
  })(t0);
}
function showNextCele(){

  el.innerHTML='<div class="cele-emoji">'+ic(c.emoji)+'</div><div><div class="cele-title">'+esc(c.title)+'</div><div class="cele-sub">'+esc(c.sub||'')+'</div></div>';

/* ---------- XP, levels, streaks, badges ---------- */
function award(mid,xp,why){
  if(!member(mid) || !(xp>0)) return 0;
  var day=todayISO(), key=mid+'|'+day+'|'+why;
  // light daily cap per habit so points stay about habits, not tapping the same button
  Object.keys(S.game.cap).forEach(function(k){ if(k.indexOf('|'+day+'|')<0) delete S.game.cap[k]; });
  if((S.game.cap[key]||0)>=10) return 0;
  S.game.cap[key]=(S.game.cap[key]||0)+1;
  var mL=levelFor(xpOf(mid),MB), fL=levelFor(famXp(),FB);
  S.game.xp[mid]=xpOf(mid)+xp;
  var wk=weekKey(Date.now()), W=S.game.wxp||(S.game.wxp={}); W[wk]=W[wk]||{}; W[wk][mid]=(W[wk][mid]||0)+xp;
  var wks=Object.keys(W).sort(); while(wks.length>26) delete W[wks.shift()];
  if(mid===S.currentUser) pendXp+=xp;
  S.game.days[day]=1;
  var nm=levelFor(xpOf(mid),MB), nf=levelFor(famXp(),FB);
  if(nm>mL){
    var m=member(mid);
    if(gameOn()) logAs(mid,'arrow-up','reached level '+nm+' ('+lvlName(nm)+')');
    cele({kind:'level',emoji:'arrow-up',title:(mid===S.currentUser?'You reached':m.name+' reached')+' level '+nm,sub:lvlName(nm)+' · good habits add up'});
    sfx('fanfare'); confetti('big');
    if(nm>=5) grant('high_five',mid);
  }
  if(nf>fL){
    if(gameOn()) logAs(mid,'home','helped the family reach family level '+nf);
    cele({kind:'level',emoji:'home',title:'Family level '+nf,sub:'A shared effort from everyone'}); sfx('fanfare'); confetti('big');
  }
  updateBest();
  if(dayStreak()>=7) grant('streak_7','family');
  return xp;
}
function grant(id,mid){
  var d=badgeDef(id); if(!d) return false;

function dayStreak(){

function weekStreak(map){

}
function trackStreak(){ // weeks in a row with no envelope going over, counted from when the family started

}

/* ---------- family challenges ---------- */
function chProgress(c){
  var have=0, n=c.n, unit='';
  if(c.kind==='skip'){
    var tid=c.envelopeId, end=todayISO(), d=c.start, spent={};
    S.txns.forEach(function(t){ if(t.amount<0 && !skipTx(t) && t.status!=='history' && t.date>=c.start && (t.envelopeId===tid || (matchRule(t.desc)||{}).envelopeId===tid)) spent[t.date]=1; });
    while(d<=end){ if(!spent[d]) have++; d=addDays(d,1); }
    unit='day';
  } else if(c.kind==='contrib'){
    var st=c.startTs||new Date(c.start+'T00:00:00').getTime();
    have=S.game.contribs.filter(function(ts){return ts>=st;}).length; unit='contribution';
  } else {
    have=Object.keys(S.game.days).filter(function(k){return k>=c.start;}).length; unit='check-in day';
  }
  have=Math.min(have,n);
  return {have:have,n:n,pct:pct(have,n),label:have+' of '+n+' '+unit+(n===1?'':'s')};
}
function checkChallenges(){
  S.game.challenges.forEach(function(c){

    var p=chProgress(c);
    if(p.have>=p.n){

}

function avgDaily(envId,beforeIso){ // what this household usually spends a day in an envelope, from its own transactions (30 days before)
  var from=addDays(beforeIso,-30), sum=0, any=false;

  return any?round2(sum/30):0;
}

/* Monthly cadence: present in at least 2 consecutive calendar months, at most 2 charges a month, and a similar amount each month. */
function monthlyInfo(list){
  var byM={};

  var months=Object.keys(byM).sort(); if(months.length<2) return null;
  if(months.some(function(m){return byM[m].length>2;})) return null;
  var per=months.map(function(m){ return median(byM[m]); }), md=median(per);
  if(per.some(function(v){ return Math.abs(v-md)>Math.max(1,md*0.15); })) return null;
  for(var i=1;i<months.length;i++){ var a=months[i-1].split('-'), b=months[i].split('-'); var gap=(+b[0]-+a[0])*12+(+b[1]-+a[1]); if(gap>2) return null; }

  return {monthly:round2(-latest.amount),months:months.length,latest:latest};

var PPM={weekly:52/12,fortnightly:26/12,monthly:1};
var FREQ_LABEL={weekly:'Weekly',fortnightly:'Fortnightly',monthly:'Monthly'};
function nextDate(iso,freq){
  if(freq==='weekly') return addDays(iso,7);
  if(freq==='fortnightly') return addDays(iso,14);
  var p=iso.split('-').map(Number), y=p[0], m=p[1]+1; if(m>12){ m=1; y++; }
  var last=new Date(y,m,0).getDate();
  return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(p[2],last)).padStart(2,'0');
}
function monthlyIncome(){ return S.pay.earners.reduce(function(a,e){ return a+(+e.amount||0)*(PPM[e.freq]||1); },0); }

/* What one pay should send where. Envelopes: their per-pay amount if set, otherwise the monthly allocation x this pay's share of monthly income. */
function payPlan(earner){
  var mi=monthlyIncome(), share=mi>0?(+earner.amount||0)/mi:0, parts=[];
  S.envelopes.forEach(function(e){
    var a=(e.perPay!=null && e.perPay!=='')?+e.perPay:round2(e.monthly*share);
    if(a>0) parts.push({k:'e',id:e.id,name:e.name,icon:e.icon,amount:round2(a),account:(e.account||'').trim()});
  });
  S.goals.forEach(function(g){ var a=+g.perPay||0; if(a>0) parts.push({k:'g',id:g.id,name:g.name,icon:g.icon,amount:round2(a),account:(g.account||'').trim()}); });
  var lines=[], byAcct={};
  parts.forEach(function(p){
    var key=p.account?'a:'+p.account.toLowerCase():p.k+':'+p.id;
    if(!byAcct[key]){ byAcct[key]={id:uid(),account:p.account,parts:[],amount:0,done:false}; lines.push(byAcct[key]); }
    byAcct[key].parts.push(p); byAcct[key].amount=round2(byAcct[key].amount+p.amount);
  });
  if(!uniqAccts().length){ // one-account households: envelope money just stays put
    var keep=lines.filter(function(l){return !l.account && l.parts[0].k==='e';}), rest=lines.filter(function(l){return keep.indexOf(l)<0;});
    if(keep.length>1){ var one={id:uid(),account:'',parts:[],amount:0,done:false,stay:true}; keep.forEach(function(l){ one.parts=one.parts.concat(l.parts); one.amount=round2(one.amount+l.amount); }); lines=[one].concat(rest); }
    else if(keep.length) keep[0].stay=true;
  }
  lines.forEach(function(l){
    var names=l.parts.map(function(p){return p.name;});
    if(l.stay){ l.label='Leave '+money(l.amount)+' in your everyday account for your envelopes (no transfer needed: '+names.join(', ')+')'; return; }
    l.label=l.account?'Move '+money(l.amount)+' to '+l.account+(l.parts.length>1||names[0]!==l.account?' ('+names.join(', ')+')':''):
      'Move '+money(l.amount)+' to '+(l.parts[0].k==='g'?l.parts[0].name+' savings':l.parts[0].name+' account');
  });
  var total=round2(lines.reduce(function(a,l){return a+l.amount;},0));
  return {lines:lines,total:total,left:round2((+earner.amount||0)-total),share:share};
}
function makePayday(earner,date,simulated){
  var plan=payPlan(earner);
  var pd={id:uid(),date:date,earnerId:earner.id,name:earner.name,amount:+earner.amount||0,simulated:!!simulated,applied:false,createdAt:Date.now(),items:plan.lines,left:plan.left};

  logAs(earner.memberId||S.currentUser,'wallet','payday: '+earner.name+' '+money(pd.amount)+(simulated?' (simulated)':'')+'. '+plan.lines.length+' transfer'+(plan.lines.length===1?'':'s')+' to do');

/* Runs when the app opens: every payday since the last check creates its own checklist. */
function processPaydays(){
  var today=todayISO(), made=0;
  S.pay.earners.forEach(function(e){
    var guard=0;
    while(e.next && e.next<=today && guard<26){
      if(!S.paydays.some(function(p){return p.earnerId===e.id && p.date===e.next && !p.simulated;})){ makePayday(e,e.next,false); made++; }
      e.next=nextDate(e.next,e.freq); guard++;
    }
  });
  S.pay.lastCheck=today;
  if(made){ cele({kind:'payday',emoji:'wallet',title:'Payday',sub:made+' payday'+(made===1?'':'s')+' since you last looked. Transfers are ready.'}); sfx('coin'); }
  return made;
}
function openTransfers(){ var n=0; S.paydays.forEach(function(p){ p.items.forEach(function(i){ if(!i.done) n++; }); }); return n; }
function nextPaydays(){ return S.pay.earners.filter(function(e){return e.next;}).map(function(e){return {e:e,date:e.next};}).sort(function(a,b){return a.date<b.date?-1:1;}); }
function finish(msg){ save(); render(); var x=gameOn()?takeXp():(takeXp(),0); if(msg||x) toast((msg||'')+(x?(msg?' · ':'')+'+'+x+' XP':'')); flushFx(); }
function tickTransfer(pid,iid,on){
  if(!isAdmin()) return toast('Only an admin can tick transfers');
  var pd=S.paydays.filter(function(p){return p.id===pid;})[0]; if(!pd) return;
  var it=pd.items.filter(function(i){return i.id===iid;})[0]; if(!it) return;
  it.done=on; it.doneAt=on?Date.now():null; it.doneBy=on?S.currentUser:null;
  if(on){
    log('check','ticked off: '+it.label+' ('+pd.name+'\'s payday '+dateAU(pd.date+'T12:00:00')+')');
    award(S.currentUser,5,'transfer'); sfx('coin');
    if(pd.items.every(function(i){return i.done;})){
      log('send','finished all '+pd.items.length+' transfers for '+pd.name+'\'s payday');
      award(S.currentUser,15,'payday-done'); grant('payday_pro',S.currentUser);
      cele({kind:'payday',emoji:'check-circle',title:'All transfers done',sub:pd.name+'\'s payday is sorted.'}); sfx('fanfare'); confetti('big');
    }
  } else { log('rotate','unticked: '+it.label); sfx('soft'); }
  finish(on?'Transfer ticked off':'Unticked');
}
function applyPayday(pid){
  if(!isAdmin()) return;
  var pd=S.paydays.filter(function(p){return p.id===pid;})[0]; if(!pd||pd.applied) return;
  var tot=0;
  pd.items.forEach(function(it){ it.parts.forEach(function(p){
    if(p.k==='e'){ var e=env(p.id); if(e){ e.balance=round2(e.balance+p.amount); tot+=p.amount; } }
    else { var g=goal(p.id); if(g){ var wb=g.saved<g.target; g.saved=round2(g.saved+p.amount); tot+=p.amount; if(wb && g.saved>=g.target){ grant('goal_reached','family'); } } }
  }); });
  tot=round2(tot);
  var fromU=Math.max(0,Math.min(S.unallocated||0,tot)); S.unallocated=round2((S.unallocated||0)-fromU);
  pd.applied=true;
  log('download','topped up envelopes and goals from '+pd.name+'\'s pay ('+money(tot)+')'+(fromU?', using '+money(fromU)+' of unallocated income':''));
  award(S.currentUser,10,'payday'); sfx('coin'); confetti('small');
  finish('Envelopes topped up from this pay');
}
function simulatePayday(eid){
  if(!isAdmin()) return;
  var e=S.pay.earners.filter(function(x){return x.id===eid;})[0]||S.pay.earners[0];
  if(!e) return toast('Add a pay schedule in Settings first');
  makePayday(e,todayISO(),true);
  cele({kind:'payday',emoji:'wallet',title:'Payday (simulated)',sub:e.name+': '+money(+e.amount||0)+'. Your transfers are ready.'}); sfx('coin'); confetti('small');
  S.tab='transfers'; done('Simulated payday for '+e.name);
}
function homePayday(){
  var n=openTransfers(), nx=nextPaydays(), h='';
  if(n){
    var pd=S.paydays.filter(function(p){return p.items.some(function(i){return !i.done;});})[0];
    h+='<div class="card payday" id="paydayCard"><div class="row"><div class="emoji">'+ic('wallet')+'</div><div class="grow"><div class="name">Payday! '+n+' transfer'+(n===1?'':'s')+' to do</div>'+
      '<div class="small">'+esc(pd.name)+' · '+dayName(pd.date)+' '+dateAU(pd.date+'T12:00:00')+' · do these in your banking app</div></div></div>'+
      '<div class="tlist">'+pd.items.slice(0,4).map(function(i){return tItem(pd,i);}).join('')+'</div>'+
      (pd.items.length>4?'<div class="small">+'+(pd.items.length-4)+' more</div>':'')+
      '<div class="actions"><button class="btn primary" data-tab="transfers">See all transfers</button></div></div>';
  }
  h+='<div class="card row nextpay" data-tab="transfers" style="cursor:pointer"><div class="emoji">'+ic('calendar')+'</div><div class="grow"><div class="name">'+(nx.length?'Next payday: '+esc(nx[0].e.name)+' · '+dayName(nx[0].date)+' '+dateAU(nx[0].date+'T12:00:00'):'Set your payday')+'</div>'+
    '<div class="small">'+(nx.length>1?nx.slice(1).map(function(x){return esc(x.e.name)+' '+dayName(x.date)+' '+dateAU(x.date+'T12:00:00');}).join(' · '):(nx.length?'Transfers to do appear here on payday':'Add your pay schedule in Settings'))+'</div>'+homeBills()+'</div><span class="chev">'+ic('chevron')+'</span></div>';
  return h;
}
function tItem(pd,i){
  return '<label class="titem'+(i.done?' done':'')+'" data-transfer="'+i.id+'"><input type="checkbox" data-tick="'+pd.id+'|'+i.id+'"'+(i.done?' checked':'')+(isAdmin()?'':' disabled')+'>'+
    '<span class="grow">'+esc(i.label)+(i.done&&i.doneBy?'<span class="small"> · done by '+esc(mname(i.doneBy))+'</span>':'')+'</span></label>';
}
function vTransfers(){
  var adm=isAdmin(), nx=nextPaydays();
  var h='<h1>Transfers to do</h1><p class="sub">On each payday the app works out what to move where. It can\'t move money itself (open banking is read-only), so do these in your banking app and tick them off.</p>';
  h+='<div class="banner info">Tip: set each of these up <b>once</b> as a recurring transfer in your bank, timed for payday. After that you just tick them off here.</div>';
  h+=transferBills();
  h+='<h2>Pay schedule</h2><div class="card">'+(S.pay.earners.length?S.pay.earners.map(function(e){
      return '<div class="srow"><div class="dot">'+ic('briefcase')+'</div><div class="grow"><div class="name">'+esc(e.name)+' · '+FREQ_LABEL[e.freq]+' · '+money(+e.amount||0)+'</div><div class="small">Next payday '+dayName(e.next)+' '+dateAU(e.next+'T12:00:00')+'</div>'+
        (adm?'<div class="actions" style="margin-top:6px"><button class="btn" data-action="simpay" data-id="'+e.id+'">Simulate payday (demo)</button></div>':'')+'</div></div>';
    }).join(''):'<div class="empty" style="padding:10px">No pay schedule yet. Add one in Settings.</div>')+
    '<p class="small" style="margin:8px 0 0">Envelopes are filled '+(S.pay.fundOn==='payday'?'<b>each payday</b> (top-up step below)':'<b>once a month</b> with “Start new month”. Switch to “each payday” in Settings to top up from each pay')+'.</p></div>';
  var list=S.paydays.slice(0,8);
  h+='<h2>Paydays</h2>';
  if(!list.length) h+='<div class="card empty" style="padding:18px">No paydays yet'+(nx.length?'. The next one is '+dateAU(nx[0].date+'T12:00:00')+'.':'.')+'</div>';
  h+=list.map(function(pd){
    var left=pd.items.filter(function(i){return !i.done;}).length;
    return '<div class="card payday'+(left?'':' alldone')+'" data-payday="'+pd.id+'"><div class="row"><div class="emoji">'+ic(left?'wallet':'check-circle')+'</div><div class="grow"><div class="name">'+esc(pd.name)+'\'s pay · '+money(pd.amount)+(pd.simulated?' <span class="pill demo">SIMULATED</span>':'')+'</div>'+
      '<div class="small">'+dayName(pd.date)+' '+dateAU(pd.date+'T12:00:00')+' · '+(left?left+' of '+pd.items.length+' to do':'All '+pd.items.length+' done')+'</div></div></div>'+
      '<div class="xpbar"><i style="width:'+pct(pd.items.length-left,pd.items.length||1)+'%"></i></div>'+
      '<div class="tlist">'+pd.items.map(function(i){return tItem(pd,i);}).join('')+'</div>'+
      '<div class="small" style="margin-top:6px">'+(pd.left>=0?'Stays in the pay account after transfers: '+money(pd.left):'Heads up: transfers are '+money(-pd.left)+' more than this pay. Adjust allocations in Envelopes or Settings.')+'</div>'+
      (S.pay.fundOn==='payday'&&adm&&!pd.applied?'<div class="actions"><button class="btn ok" data-action="applypay" data-id="'+pd.id+'">Top up envelopes &amp; goals from this pay</button></div>':'')+
      (pd.applied?'<div class="note">Envelopes and goals topped up from this pay.</div>':'')+'</div>';
  }).join('');
  return h;
}
function payPlanPreview(){
  return S.pay.earners.map(function(e){ var p=payPlan(e); return esc(e.name)+': '+p.lines.length+' transfers, '+money(p.total)+' a pay'; }).join(' · ');
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-tab],[data-action],[data-filter]'); if(!t) return;
  if(t.hasAttribute('data-tab')){ ev.preventDefault(); closeSheet(); S.tab=t.getAttribute('data-tab'); save(); render(); window.scrollTo(0,0); return; }
  if(t.hasAttribute('data-filter')){ S.reqFilter=t.getAttribute('data-filter'); save(); render(); return; }
  var a=t.getAttribute('data-action'), id=t.getAttribute('data-id');
  switch(a){
    case 'close': closeSheet(); break;
    case 'request': sRequest(id); break;
    case 'approve': sDecide(id,true); break;
    case 'decline': sDecide(id,false); break;
    case 'cancelreq': cancelReq(id); break;
    case 'newenv': sEnvelope(null); break;
    case 'editenv': sEnvelope(id); break;
    case 'delenv': delEnv(id); break;
    case 'addmoney': sAddMoney(id); break;
    case 'topup': sTopUp(); break;
    case 'newgoal': sGoal(null); break;
    case 'editgoal': sGoal(id); break;
    case 'delgoal': delGoal(id); break;
    case 'contribute': sContribute(id); break;
    case 'settings': sSettings(); break;
    case 'addmember': addMember(id); break;
    case 'members': sMembers(); break;
    case 'delmember': delMember(id); break;
    case 'restartsetup': sRestart(); break;
    case 'exportbackup': exportBackup(); break;
    case 'undosnap': undoSnap(); break;
    case 'assignincome': sAssignIncome(); break;
    case 'recordincome': sRecordIncome(); break;
    case 'connectbank': sConnectBank(); break;
    case 'syncbank': syncDemo(); break;
    case 'disconnect': disconnectBank(id); break;
    case 'sorttxn': sSortTxn(id); break;
    case 'ignoretxn': ignoreTxn(id); break;
    case 'transfertxn': ignoreTxn(id,'transfer'); break;
    case 'fixtxn': sFixTxn(id); break;
    case 'bankfilter': S.bankFilter=id; save(); render(); break;
    case 'simpay': simulatePayday(id); break;
    case 'applypay': applyPayday(id); break;
    case 'addearner': addEarner(); break;
    case 'delearner': delEarner(id); break;
    case 'newchallenge': ev.preventDefault(); sChallenge(); break;
    case 'takeawaychallenge': sChallenge({kind:'skip',envelopeId:takeawayEnvId()}); break;
    case 'movechallenge': sMoveChallenge(id); break;
    case 'demohistory': loadHistory(); break;
    case 'reviewidea': sReviewIdea(id); break;
    case 'billchecked': sBillChecked(id); break;
    case 'ideanotnow': ideaSet(id,'dismissed','',0); break;
    case 'ideagotit': ideaSet(id,'done','streaming overlap',10); break;
    case 'ideasreset': ev.preventDefault(); S.savings={}; save(); render(); break;
    case 'reset': sReset(); break;
  }
});
document.getElementById('scrim').addEventListener('click',function(ev){ if(ev.target.id==='scrim') closeSheet(); });
document.addEventListener('change',function(ev){
  var t=ev.target; if(t.id!=='backupFile'||!t.files||!t.files[0]) return;
  if(S && !can('settings')) return toast('Only someone who can manage settings can restore a backup');
  var r=new FileReader(); r.onload=function(){ importBackupText(String(r.result)); t.value=''; }; r.readAsText(t.files[0]);
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='sheetForm') return; ev.preventDefault(); if(!sheetSubmit) return;
  var f=ev.target, big=null; // sanity check: amounts over $100,000 need a second tap
  f.querySelectorAll('input[inputmode=decimal]').forEach(function(i){ if(!big && parseAmt(i.value)>100000) big=i; });
  if(big && f.getAttribute('data-bigok')!==big.name+'='+big.value){ f.setAttribute('data-bigok',big.name+'='+big.value); return sheetErr('That\'s '+money(parseAmt(big.value))+'. Check the amount. If it\'s right, tap the button again.',big); }
  sheetSubmit();
});
document.addEventListener('input',function(ev){ if(sheetLive && ev.target.closest && ev.target.closest('#sheetForm')) sheetLive(ev.target); });
document.addEventListener('change',function(ev){ if(sheetLive && ev.target.closest && ev.target.closest('#sheetForm')) sheetLive(ev.target); });
document.getElementById('viewAs').addEventListener('change',function(ev){
  S.currentUser=ev.target.value; save(); render(); toast('Now viewing as '+me().name);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.hasAttribute('data-roll')) setRoll(t.getAttribute('data-roll'), t.checked?((env(t.getAttribute('data-roll'))||{}).rollTo||(S.goals[0]&&S.goals[0].id)||''):'');
  else if(t.hasAttribute('data-rollgoal')) setRoll(t.getAttribute('data-rollgoal'), t.value);
  else if(t.id==='csvFile' && t.files && t.files[0]) importCSVFile(t.files[0], t);
  else if(t.hasAttribute('data-tick')){ var pp=t.getAttribute('data-tick').split('|'); tickTransfer(pp[0],pp[1],t.checked); }
  else if(t.id==='soundToggle'){ S.settings.sound=t.checked; save(); if(t.checked){ playSound('ding'); } toast(t.checked?'Sounds on':'Sounds off'); }
  else if(t.id==='motionToggle'){ S.settings.motion=t.checked; save(); toast(t.checked?'Celebrations on':'Celebrations off'); }
});
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') closeSheet(); });

document.getElementById('brandLogo').innerHTML=LOGO;
load();
if(S){ processPaydays(); checkChallenges(); save(); render(); flushFx(); } else { var ob0=null; try{ ob0=JSON.parse(sessionStorage.getItem(OBS_KEY)||'null'); }catch(e){} startOnboarding(false); if(ob0&&ob0.step&&OBV[ob0.step]&&!ob0.restart){ OB=ob0; renderOnb(); } }
window.__app={importBackupText:importBackupText,parseBackup:parseBackup,backupJSON:backupJSON,getSnap:getSnap,looksTransfer:looksTransfer,markTxn:markTxn,badgeList:function(){return badgeList().map(function(b){return b.id;});},payPlan:function(i){return payPlan(S.pay.earners[i||0]);},cal:{occur:occur,upcoming:function(n,d){return upcoming(n,d).map(function(o){return {id:o.ev.id,type:o.ev.type,title:evTitle(o),date:o.date,days:o.days,remind:inRemind(o)};});},next:function(id){var e=evSeriesById(id),o=e&&nextOcc(e);return o?{date:o.date,days:o.days,title:evTitle(o)}:null;},bills:function(){return billsBeforePayday().list.map(function(o){return o.ev.id+'|'+o.date;});}},setup:function(){return S&&S.setup;},onboarding:function(){return !!(OB&&document.body.classList.contains('onboarding'));},hasEmoji:function(t){ return /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2194}-\u{21FF}\u{2300}-\u{23FF}\u{FE0F}]/u.test(String(t)); },state:function(){return S;},parseStatement:parseStatement,importCSVText:importCSVText,fx:fxLog,findSavings:findSavings,dayStreak:dayStreak,clearCele:function(){clearCele();},render:function(){render();},flush:flushFx};
})();
